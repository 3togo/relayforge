# Wi-Fi Hotspot Configuration
BACKEND=create_ap
WIFI_IFACE=wlan0
INTERNET_IFACE=wlan0
SSID=Hotspot
PASSPHRASE=12345678
FREQ_BAND=auto
CHANNEL=default
GATEWAY=192.168.12.1
WPA_VERSION=2
ETC_HOSTS=0
DHCP_DNS=gateway
NO_DNS=0
NO_DNSMASQ=0
HIDDEN=0
MAC_FILTER=0
MAC_FILTER_ACCEPT=/etc/hostapd/hostapd.accept
ISOLATE_CLIENTS=0
SHARE_METHOD=nat
IEEE80211N=0
IEEE80211AC=0
IEEE80211AX=0
NO_VIRT=0
USE_PSK=0
