name: Release validation
on:
  workflow_dispatch:
  push:
    branches: ['build/release-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    timeout-minutes: 45
    steps:
      - name: Install build and test dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cargo rustc dpkg-dev python3 python3-gi dbus-daemon tini dnsmasq-base locales xvfb xauth gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-ayatanaappindicator3-0.1
          # GNOME Control Center's keyboard tests explicitly require this locale.
          localedef -i en_US -f UTF-8 en_US.UTF-8
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y network-manager-applet gnome-control-center
          useradd --create-home builder
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build packages and run complete suites
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash ci/build-release.sh
      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relayforge-0.1.1-ubuntu26.10-amd64
          path: artifacts/release/
          if-no-files-found: error
      - name: Upload upgrade baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-baseline
          path: artifacts/upgrade-baseline/*.deb
          if-no-files-found: error
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-test-logs
          path: |
            artifacts/release-logs/
            artifacts/desktop-build/*/build.log
  lifecycle:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, desktop-integrated]
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: relayforge-0.1.1-ubuntu26.10-amd64
          path: artifacts/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-baseline
          path: artifacts/upgrade-baseline
      - name: Clean install, upgrade, remove and purge
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p artifacts/lifecycle
          bash ci/package-lifecycle.sh "$VARIANT" > "artifacts/lifecycle/$VARIANT.log" 2>&1
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lifecycle-${{ matrix.variant }}
          path: artifacts/lifecycle/
