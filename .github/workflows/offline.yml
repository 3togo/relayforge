name: Offline parity checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.10
      options: --init
    timeout-minutes: 30
    steps:
      - name: Prepare the disposable build environment
        shell: bash
        run: |
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ca-certificates git build-essential cargo rustc pkg-config dpkg-dev \
            python3 python3-gi python3-opencv python3-numpy dbus xauth xvfb nodejs \
            gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-ayatanaappindicator3-0.1 \
            libgtk-3-dev libjansson-dev dnsmasq-base desktop-file-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare an ordinary build user and locked dependencies
        shell: bash
        run: |
          useradd --create-home --shell /bin/bash relayforge-build
          chown -R relayforge-build:relayforge-build "$GITHUB_WORKSPACE"
          runuser -u relayforge-build -- cargo fetch --locked
      - name: Run bounded offline checks
        shell: bash
        run: |
          runuser -u relayforge-build -- xvfb-run -a python3 tools/check-offline.py --with-applet --jobs 4
      - name: Assemble lifecycle fixtures without installing
        shell: bash
        run: |
          runuser -u relayforge-build -- python3 tools/build-deb.py \
            --binary /usr/bin/dash --version '0.1.0~lifecycle1' \
            --output-dir artifacts/lifecycle/v1 --with-gnome
          runuser -u relayforge-build -- python3 tools/build-deb.py \
            --binary /usr/bin/dash --version '0.1.0~lifecycle2' \
            --output-dir artifacts/lifecycle/v2 --with-gnome
      - name: Check isolated package file lifecycle
        shell: bash
        run: |
          python3 tools/check-package-lifecycle.py --files-only \
            artifacts/lifecycle/v1/relayforge_0.1.0~lifecycle1_amd64.deb \
            artifacts/lifecycle/v2/relayforge_0.1.0~lifecycle2_amd64.deb \
            --old-gnome artifacts/lifecycle/v1/relayforge-gnome_0.1.0~lifecycle1_all.deb \
            --new-gnome artifacts/lifecycle/v2/relayforge-gnome_0.1.0~lifecycle2_all.deb \
            --old-tray artifacts/lifecycle/v1/relayforge-tray_0.1.0~lifecycle1_all.deb \
            --new-tray artifacts/lifecycle/v2/relayforge-tray_0.1.0~lifecycle2_all.deb \
            > artifacts/lifecycle/check.log 2>&1
      - name: Retain validation logs and manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-parity-validation
          path: |
            artifacts/validation/
            artifacts/lifecycle/check.log
          if-no-files-found: warn
          retention-days: 14
